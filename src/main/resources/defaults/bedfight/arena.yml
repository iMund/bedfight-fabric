# Configuracao das instancias de arena do Bed Fight.
# Cada instancia e a sua propria dimensao dedicada (bedfight:arena_0, arena_1,
# ...), nao configuravel aqui - sao datapacks embutidos no mod
# (data/bedfight/dimension/arena_N.json). Tem 16 registradas; aumentar o pool
# alem disso exige adicionar mais um desses arquivos.

# Quantas partidas podem rodar ao mesmo tempo, cada uma na sua propria instancia
# (dimensao) isolada. Se todas estiverem ocupadas quando uma fila enche, os
# jogadores continuam esperando na fila ate uma instancia liberar.
instancePoolSize: 4
